    <div class="layout">
      <aside class="sidebar">
        <div class="header">Conversaciones Telegram</div>
        <div class="chat-list">
          <div 
            *ngFor="let chat of chats" 
            class="chat-item" 
            [class.active]="selectedChat?.id === chat.id"
            (click)="selectChat(chat)">
            <div>
              <strong>{{ chat.username }}</strong>
              <div class="preview">{{ chat.lastMessage }}</div>
            </div>
            <span *ngIf="chat.unreadCount > 0" class="badge">{{ chat.unreadCount }}</span>
          </div>
        </div>
      </aside>

      <main class="chat-area" *ngIf="selectedChat">
        <div class="header">Chat con {{ selectedChat.username }}</div>
        <div class="messages">
          <div 
            *ngFor="let msg of selectedChat.messages" 
            class="msg" 
            [class.msg-in]="!msg.isOutgoing" 
            [class.msg-out]="msg.isOutgoing">
            {{ msg.text }}
          </div>
        </div>
        <div class="input-box">
          <input 
            type="text" 
            [(ngModel)]="newMessageText" 
            (keyup.enter)="sendMessage()"
            placeholder="Escriba su respuesta..." />
          <button (click)="sendMessage()">Enviar</button>
        </div>
      </main>
    </div>
